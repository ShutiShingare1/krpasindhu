# Render.com Blueprint — Krupa Sindhu Advertising & Software Pvt. Ltd.
# This file deploys BOTH the backend API and the frontend static site.

services:
  # ─────────────────────────────────────────────
  # 1. Backend — Node / Express API
  # ─────────────────────────────────────────────
  - type: web
    name: krupasindhu-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false        # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false        # Set this manually in Render dashboard
      - key: CLIENT_URL
        sync: false        # Set to your Vercel/Render frontend URL

  # ─────────────────────────────────────────────
  # 2. Frontend — React / Vite Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: krupasindhu-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false        # Set to your backend Render URL, e.g. https://krupasindhu-server.onrender.com
